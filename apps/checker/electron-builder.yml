appId: com.foolshang.poe-price-trade-checker-ts
productName: PoE-Price-Trade-Checker-TS
copyright: MIT
directories:
  output: ../../dist-checker
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/koffi/**"
compression: maximum
electronLanguages: [en-US]
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: resources/
    to: meta/
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: PoE Price & Trade Checker (TypeScript)
  deleteAppDataOnUninstall: false  # the settings (%LOCALAPPDATA%\PoePriceTradeTS) are never removed
  runAfterFinish: true
  artifactName: PoE-Price-Trade-Checker-TS-Setup-${version}.exe
