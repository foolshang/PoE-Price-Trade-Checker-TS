appId: com.foolshang.poe-filter-generator-ts
productName: PoE-Filter-Generator-TS
copyright: MIT
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: maximum
electronLanguages: [en-US]
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true                   # no wizard: one click installs for the current user, no admin rights
  perMachine: false                # %LOCALAPPDATA%\Programs\PoE-Filter-Generator-TS
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: true      # the player can delete it
  shortcutName: PoE Filter Generator (TypeScript)
  deleteAppDataOnUninstall: false  # the settings (%LOCALAPPDATA%\PoeFilterGenTS) and the game folders are never removed
  runAfterFinish: true
  artifactName: PoE-Filter-Generator-TS-Setup-${version}.exe
