appId: com.foolshang.poe-filter-generator-ts
productName: PoE-Filter-Generator-TS
copyright: MIT
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: maximum
electronLanguages: [en-US]
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip                 # no install: unpack anywhere and run (this copy cannot update itself: it says a newer release exists)
      arch: [x64]
  artifactName: PoE-Filter-Generator-TS-Portable-${version}.zip
nsis:
  oneClick: true                   # no wizard: one click installs for the current user, no admin rights
  perMachine: false                # %LOCALAPPDATA%\Programs\PoE-Filter-Generator-TS
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: true      # the player can delete it
  uninstallDisplayName: PoE1 & PoE2 Filter Generator ${version}
  shortcutName: PoE Filter Generator
  deleteAppDataOnUninstall: false  # the settings (%LOCALAPPDATA%\PoeFilterGenTS) and the game folders are never removed
  runAfterFinish: true
  artifactName: PoE-Filter-Generator-TS-Setup-${version}.exe
publish:
  - provider: github
    owner: foolshang
    repo: PoE-Filter-Generator
    releaseType: release
    channel: latest                 # latest.yml in the release (the Filter Generator)
