appId: com.foolshang.poe-filter-generator-ts
productName: PoE-Filter-Generator-TS
copyright: MIT
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: maximum
electronLanguages: [en-US]
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
  signAndEditExecutable: true
portable:
  artifactName: PoE-Filter-Generator-TS.exe
  splashImage: build/splash.bmp
