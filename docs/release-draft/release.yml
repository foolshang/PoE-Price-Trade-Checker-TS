# DRAFT - not active (it lives in docs/, GitHub only runs .github/workflows/). Moved to .github/workflows/release.yml when Winai orders part B.
#
# Tag v1.0.0 (or a prerelease tag v1.0.0-rc.1) -> build on a Windows runner -> two releases:
#   Checker:          the Releases of THIS repo (foolshang/PoE-Price-Trade-Checker-TS): Setup.exe + checker.yml + blockmap + Portable zip   (B0 answered)
#   Filter Generator: the public repo foolshang/PoE-Filter-Generator, as the original did: Setup.exe + latest.yml + blockmap + Portable zip
# The text of each release page is the section of the tag in apps/<app>/CHANGELOG.md (tools/release-notes.mjs); a tag without such a section stops the release.
# A tag with a "-" is a prerelease: it never becomes "Latest" and never touches the README or the web page (electron-updater of a
# stable copy skips it as well).
name: Build & Release (TypeScript)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  # the web page goes first (a prerelease never deploys); a failed deploy does not stop the programs, but the README is then not updated
  web:
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, '-') }}
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      dry_run: false
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-release:
    needs: web
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Resolve tag
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="$REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # the programs show their version in the title bar and the log: refuse a tag that does not match package.json
      - name: Check the tag matches package.json
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          src=$(node -p "require('./package.json').version")
          want="${TAG#v}"
          echo "tag=$TAG  package.json version=$src"
          if [ "$want" != "$src" ]; then
            echo "::error::Tag $TAG does not match package.json $src - bump the version first"
            exit 1
          fi

      # koffi's prebuilt binary is fetched by a script that npm's policy skips (docs/PHASE4.md, "Build")
      - run: npm ci
      - run: npm run desktop:setup

      - name: Check before building (types, lint, unit tests, parity of the committed goldens)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Pack the Filter Generator
        run: npm run desktop:pack
      - name: Pack the Checker
        run: npm run checker:pack

      - name: Check the files
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="${TAG#v}"
          for f in "dist/PoE-Filter-Generator-TS-Setup-$v.exe" "dist/PoE-Filter-Generator-TS-Portable-$v.zip" dist/latest.yml \
                   "dist-checker/PoE-Price-Trade-Checker-TS-Setup-$v.exe" "dist-checker/PoE-Price-Trade-Checker-TS-Portable-$v.zip" dist-checker/checker.yml; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      # the text of both release pages = the section of the tag in each app's CHANGELOG.md (also built into the program: the About window)
      - name: Release notes from the CHANGELOGs
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          node tools/release-notes.mjs checker "$TAG" > release-notes-checker.md
          node tools/release-notes.mjs filtergen "$TAG" > release-notes-filtergen.md

      # B0 (answered): the Checker is released in the Releases of THIS repo (public). Its README does not link to it; the program finds it by itself.
      - name: Publish the Checker (the Releases of this repo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="${TAG#v}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY"             --title "PoE Price & Trade Checker $TAG"             --notes-file release-notes-checker.md $PRERELEASE             "dist-checker/PoE-Price-Trade-Checker-TS-Setup-$v.exe" "dist-checker/PoE-Price-Trade-Checker-TS-Setup-$v.exe.blockmap" dist-checker/checker.yml             "dist-checker/PoE-Price-Trade-Checker-TS-Portable-$v.zip"

      # the Filter Generator stays where the original published it (the public Filter Generator repo); WHEN it moves to the new update
      # system is a separate order from Winai
      - name: Publish the Filter Generator (the public Filter Generator repo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="${TAG#v}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --repo foolshang/PoE-Filter-Generator             --title "PoE Filter Generator $TAG"             --notes-file release-notes-filtergen.md $PRERELEASE             "dist/PoE-Filter-Generator-TS-Setup-$v.exe" "dist/PoE-Filter-Generator-TS-Setup-$v.exe.blockmap" dist/latest.yml             "dist/PoE-Filter-Generator-TS-Portable-$v.zip"

      - name: Update the README of the public repo (a real release only)
        if: ${{ !contains(steps.ver.outputs.tag, '-') && needs.web.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: bash release/update_public_readme.sh
